<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#182821" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="¿Qué cocino?" />
  <meta name="description" content="Descubrí qué podés cocinar con lo que tenés en la alacena ahora mismo." />

  <title>¿Qué cocino hoy?</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Contenido dinámico inyectado por app.js -->
    <div id="loading-screen">
      <div class="loading-logo">🍳</div>
      <p>Cargando...</p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="src/utils/storage.js"></script>
  <script src="src/utils/ingredientMatch.js"></script>
  <script src="src/utils/historial.js"></script>
  <script src="src/services/spoonacular.js"></script>
  <script src="src/components/components.js"></script>
  <script src="src/pages/home.js"></script>
  <script src="src/pages/ingredientes.js"></script>
  <script src="src/pages/resultado.js"></script>
  <script src="src/pages/ajustes.js"></script>
  <script src="src/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registrado:', reg.scope))
          .catch(err => console.warn('SW error:', err));
      });
    }
  </script>
</body>
</html>
